<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KingChess — Chơi cờ vua</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="vendor/chessboard.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>KingChess — Chơi trực tuyến</h1>
      </header>

      <main>
        <div class="main-grid">
          <div class="board-card">
            <div id="board"></div>
          </div>

          <aside class="controls-panel">
            <div class="meta">
              <div>
                <strong>KingChess</strong>
                <div class="small">Chơi online hoặc với máy</div>
              </div>
              <div class="small" id="status">Trạng thái: chưa kết nối</div>
            </div>

            <div class="controls-row">
              <input id="roomInput" placeholder="Mã phòng (ví dụ: room1)" />
              <button id="joinBtn" class="btn">Join</button>
            </div>

            <div class="controls-row">
              <button id="resetBtn" class="btn ghost">Đặt lại</button>
              <div class="mode-select" style="margin-left:auto">
                <button id="modeOnline" class="active">Online</button>
                <button id="modeLocal">Local</button>
                <button id="modeAI">Vs Máy</button>
              </div>
            </div>

            <div class="controls-row">
              <label class="small">Màu:</label>
              <select id="sideSelect">
                <option value="white">Trắng</option>
                <option value="black">Đen</option>
              </select>
              <button id="startAI" class="btn" style="margin-left:auto">Bắt đầu vs Máy</button>
            </div>

            <div class="moves-list" id="moves"></div>
          </aside>
        </div>
      </main>

      <footer>
        <small>Đơn giản: luật cờ bởi chess.js, giao diện bởi chessboard.js</small>
      </footer>
    </div>

    <script src="vendor/jquery.min.js"></script>
    <script src="vendor/chessboard.js"></script>
    <script src="vendor/chess.js"></script>
    <script>
      let socket = null;
      const statusEl = document.getElementById('status');
      const joinBtn = document.getElementById('joinBtn');
      const resetBtn = document.getElementById('resetBtn');
      const roomInput = document.getElementById('roomInput');
      const movesEl = document.getElementById('moves');
      const modeOnline = document.getElementById('modeOnline');
      const modeLocal = document.getElementById('modeLocal');
      const modeAI = document.getElementById('modeAI');
      const startAI = document.getElementById('startAI');
      const sideSelect = document.getElementById('sideSelect');

      let board = null;
      const game = new Chess();
      let currentRoom = null;
      let mode = 'online'; // online | local | ai
      let aiDepth = 3;
      let aiColor = 'black';

      function setMode(m){
        mode = m;
        [modeOnline, modeLocal, modeAI].forEach(b=>b.classList.remove('active'));
        if(m==='online') modeOnline.classList.add('active');
        if(m==='local') modeLocal.classList.add('active');
        if(m==='ai') modeAI.classList.add('active');
      }

      modeOnline.addEventListener('click', ()=>setMode('online'));
      modeLocal.addEventListener('click', ()=>setMode('local'));
      modeAI.addEventListener('click', ()=>setMode('ai'));

      startAI.addEventListener('click', ()=>{
        aiColor = sideSelect.value === 'white' ? 'black' : 'white';
        setMode('ai');
        game.reset();
        board.start();
        updateStatus();
        if(aiColor==='white') window.setTimeout(doAIMove, 300);
      });

      // Try to detect socket.io on same origin; if not present, run in local/offline mode
      function tryLoadSocket() {
        fetch('/socket.io/socket.io.js', { method: 'HEAD' }).then(res => {
          if (!res.ok) throw new Error('no-socket');
          const s = document.createElement('script');
          s.src = '/socket.io/socket.io.js';
          s.onload = () => {
            socket = io();
            setupSocketHandlers();
            statusEl.textContent = 'Trạng thái: Kết nối server sẵn sàng (online)';
          };
          s.onerror = () => {
            statusEl.textContent = 'Trạng thái: offline (chỉ chơi local)';
          };
          document.head.appendChild(s);
        }).catch(() => {
          statusEl.textContent = 'Trạng thái: offline (chỉ chơi local)';
        });
      }

      function setupSocketHandlers() {
        if (!socket) return;
        socket.on('move', (move) => {
          game.move(move);
          board.position(game.fen());
          updateStatus();
        });

        socket.on('reset', () => {
          game.reset();
          board.start();
          updateStatus();
        });
      }

      tryLoadSocket();

      function onDragStart(source, piece, position, orientation) {
        if (game.game_over()) return false;
        // if playing vs AI, restrict moving side
        if (mode==='ai'){
          if ((aiColor==='white' && piece.search(/^w/)===0) || (aiColor==='black' && piece.search(/^b/)===0)) return false;
        }
        // only allow moving the side to move
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }

      function onDrop(source, target) {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        updateStatus();
        if (mode==='online' && currentRoom && socket) socket.emit('move', { room: currentRoom, move });
        if (mode==='ai'){
          // after player move, let AI respond
          if (!game.game_over()) window.setTimeout(doAIMove, 120);
        }
      }

      function onSnapEnd() { board.position(game.fen()); }

      const config = { draggable: true, position: 'start', onDragStart, onDrop, onSnapEnd };
      board = ChessBoard('board', config);

      function updateStatus() {
        let status = '';
        const moveColor = game.turn() === 'w' ? 'White' : 'Black';

        if (game.in_checkmate()) {
          status = 'Checkmate. ' + (moveColor === 'White' ? 'Black' : 'White') + ' thắng.';
        } else if (game.in_draw()) {
          status = 'Hòa.';
        } else {
          status = moveColor + ' đến lượt.' + (game.in_check() ? ' Check!' : '');
        }

        statusEl.textContent = 'Trạng thái: ' + status;
        movesEl.textContent = game.pgn() || 'Chưa có nước đi';
      }

      joinBtn.addEventListener('click', () => {
        const room = roomInput.value.trim();
        if (!room) return alert('Nhập mã phòng.');
        if (!socket) return alert('Chế độ offline: server không khả dụng.');
        currentRoom = room;
        socket.emit('join', room, () => {
          statusEl.textContent = 'Trạng thái: Đã vào phòng ' + room;
        });
      });

      resetBtn.addEventListener('click', () => {
        game.reset();
        board.start();
        updateStatus();
        if (currentRoom && socket) socket.emit('reset', currentRoom);
      });

      // Simple AI (negamax with material eval)
      function evaluateBoard(g){
        const values = { p:1,n:3,b:3,r:5,q:9,k:900 };
        const board = g.board();
        let score = 0;
        for(let r of board) for(let p of r) if(p) score += (p.color==='w'?1:-1)*values[p.type];
        return score;
      }

      function negamax(g, depth, alpha, beta){
        if(depth===0) return evaluateBoard(g);
        let max = -Infinity;
        const moves = g.moves({verbose:true});
        if(moves.length===0) return evaluateBoard(g);
        for(let m of moves){
          g.move(m);
          let val = -negamax(g, depth-1, -beta, -alpha);
          g.undo();
          if(val>max) max=val;
          if(val>alpha) alpha=val;
          if(alpha>=beta) break;
        }
        return max;
      }

      function getBestMove(g, depth){
        const moves = g.moves({verbose:true});
        let best = null; let max = -Infinity;
        for(let m of moves){
          g.move(m);
          let val = -negamax(g, depth-1, -Infinity, Infinity);
          g.undo();
          if(val>max){ max=val; best=m; }
        }
        return best;
      }

      function doAIMove(){
        if(mode!=='ai' || game.game_over()) return;
        // If it's AI's turn
        const turn = game.turn() === 'w' ? 'white' : 'black';
        if(turn !== aiColor) return;
        const mv = getBestMove(game, aiDepth) || (game.moves({verbose:true})[0]);
        if(mv){
          game.move(mv);
          board.position(game.fen());
          updateStatus();
        }
      }

      updateStatus();
    </script>
  </body>
</html>
